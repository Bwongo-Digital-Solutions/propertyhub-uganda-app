name: Build Android APK

on:
  push:
    branches:
      - main
      - '**'
    paths:
      - '**'
      - '!README.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build PropertyHub Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # This repository currently has no npm lockfile. Disable package caching
          # until a package-lock.json is committed, because setup-node caching
          # requires a lockfile to calculate its cache key.
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release"
          find "$APK_PATH" -maxdepth 1 -name '*.apk' -type f -print -quit | grep -q .
          ls -lh "$APK_PATH"/*.apk

      # Keep artifacts only for main-branch builds or manually requested builds.
      # PR/feature-branch builds still validate compilation but do not consume
      # artifact storage for every commit.
      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: propertyhub-uganda-android-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
