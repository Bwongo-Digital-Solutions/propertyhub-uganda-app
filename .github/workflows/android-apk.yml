name: Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: ["carbon/mobile-mvp"]
jobs:
  android-debug:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://10.0.2.2:8788/api' }}
      EXPO_PUBLIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "${SDKMANAGER}" ]]; then
            echo "Could not locate Android sdkmanager under ${ANDROID_HOME}/cmdline-tools" >&2
            exit 1
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - run: npm install
      - run: npm run typecheck
      - run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: propertyhub-uganda-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
